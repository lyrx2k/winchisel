[package]
authors = ["lyrx2k"]
name = "Winchisel"
description = "Winchisel is a native Windows tweaking utility written in Rust."
repository = "https://github.com/lyrx2k/winchisel"
version = "0.1.8"
edition = "2024"
build = "src/build.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
eframe = "0.34.1"
egui_extras = "0.34.1"
egui-notify = "0.22.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"
sysinfo = "0.39.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "3.3.0", features = ["native-tls"] }
sha2 = "0.11.0"
iconflow = { version = "1.0.0", features = ["pack-lucide"] }

[build-dependencies]
winres = "0.1.12"
